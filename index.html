<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini Game</title>
<style>
body { margin:0; overflow:hidden; background:#87CEEB; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,5);
scene.add(light);

// земля
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshLambertMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// игрок
const player = new THREE.Object3D();
player.position.y = 2;
scene.add(player);

// камера (как FPS)
camera.position.set(0,2,0);

// управление
let keys = {};
let velocity = new THREE.Vector3();

// мышь (поворот)
let yaw = 0;
let pitch = 0;

// POINTER LOCK
document.addEventListener("click", () => {
    document.body.requestPointerLock();
});

// Ctrl включает/выключает мышь
document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;

    if (e.key === "Control") {
        if (document.pointerLockElement) {
            document.exitPointerLock();
        } else {
            document.body.requestPointerLock();
        }
    }
});

document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// мышь движение
document.addEventListener("mousemove", (e) => {
    if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;

        pitch = Math.max(-1.5, Math.min(1.5, pitch));
    }
});

// деревья
function tree(x,z){
    const trunk = new THREE.Mesh(
        new THREE.BoxGeometry(0.5,2,0.5),
        new THREE.MeshLambertMaterial({color:0x8B4513})
    );
    trunk.position.set(x,1,z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1),
        new THREE.MeshLambertMaterial({color:0x00ff00})
    );
    leaves.position.set(x,3,z);
    scene.add(leaves);
}

for(let i=0;i<30;i++){
    tree((Math.random()*40)-20, (Math.random()*40)-20);
}

// движение
function update(){
    const speed = keys["shift"] ? 0.2 : 0.1;

    let forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    let right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

    if(keys["w"]) velocity.add(forward.multiplyScalar(speed));
    if(keys["s"]) velocity.add(forward.multiplyScalar(-speed));
    if(keys["a"]) velocity.add(right.multiplyScalar(-speed));
    if(keys["d"]) velocity.add(right.multiplyScalar(speed));

    // замедление (убирает дрожание)
    velocity.multiplyScalar(0.85);

    player.position.add(velocity);

    // камера вращение
    camera.position.copy(player.position);

    const lookDir = new THREE.Vector3(
        Math.cos(pitch) * Math.sin(yaw),
        Math.sin(pitch),
        Math.cos(pitch) * Math.cos(yaw)
    );

    camera.lookAt(player.position.clone().add(lookDir));
}

// loop
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
