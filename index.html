<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS GTA LEGO DAMAGE</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaad6ff, 40, 220);
scene.background = new THREE.Color(0xaad6ff);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER (ТЕНИ ВКЛЮЧЕНЫ) =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ================= LIGHT (УЛУЧШЕННЫЕ ТЕНИ) =================
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(80,140,60);
sun.castShadow = true;
sun.shadow.mapSize.width = 4096;
sun.shadow.mapSize.height = 4096;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,0.35));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800,800),
    new THREE.MeshStandardMaterial({color:0x2fa84a, roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y=2;
scene.add(player);

// ================= INPUT (НЕ ТРОГАЮ) =================
const keys={};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

// ================= MOUSE (НЕ ТРОГАЮ) =================
let yaw=0,pitch=0;
document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw-=e.movementX*0.002;
    pitch-=e.movementY*0.002;
    pitch=Math.max(-1.4,Math.min(1.4,pitch));
});
document.body.onclick=()=>document.body.requestPointerLock();

// ================= TREES =================
const trees=[];

function tree(x,z){
    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.5,3),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    trunk.position.y=1.5;
    trunk.castShadow=true;

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(2,10,10),
        new THREE.MeshStandardMaterial({color:0x1f7a2e})
    );
    leaves.position.y=3.5;
    leaves.castShadow=true;

    g.add(trunk,leaves);
    g.position.set(x,0,z);

    scene.add(g);
    trees.push(g);
}

// ================= CAR =================
function createCar(color,x,z,type){

    const car=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(type==="bus"?6:4,1.5,type==="bus"?10:7),
        new THREE.MeshStandardMaterial({
            color,
            metalness:0.4,
            roughness:0.3
        })
    );
    body.position.y=1.2;
    body.castShadow=true;
    car.add(body);

    const wheels=[];
    const wheelMeshes=[];

    function wheel(x,z){
        const w=new THREE.Mesh(
            new THREE.CylinderGeometry(0.6,0.6,0.5,16),
            new THREE.MeshStandardMaterial({color:0x111})
        );
        w.rotation.z=Math.PI/2;
        w.position.set(x,0.6,z);
        w.castShadow=true;

        car.add(w);
        wheels.push(w);
        wheelMeshes.push(w);
    }

    wheel(2,3); wheel(-2,3); wheel(2,-3); wheel(-2,-3);

    car.position.set(x,0,z);

    car.userData={
        type,
        speed:0,
        yaw:0,
        wheels:wheelMeshes,
        damage:0
    };

    scene.add(car);
    return car;
}

// ================= CARS =================
const cars=[
    createCar(0xff0000,20,20,"sport"),
    createCar(0x3333ff,-20,10,"bus")
];

let currentCar=null;

// ================= PHYSICS =================
let velY=0;
let grounded=true;

// ================= CAMERA =================
function fpsCamera(){
    camera.position.copy(player.position);

    const dir=new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

function carCamera(car){
    const offset=new THREE.Vector3(
        -Math.sin(car.userData.yaw)*8,
        3,
        -Math.cos(car.userData.yaw)*8
    );

    camera.position.copy(car.position.clone().add(offset));
    camera.lookAt(car.position);
}

// ================= LEGO DAMAGE SYSTEM =================
function damageCar(car){

    car.userData.damage++;

    car.children.forEach(part=>{
        if(Math.random()<0.3){
            part.position.x += (Math.random()-0.5)*1.5;
            part.position.y += Math.random()*1.2;
            part.position.z += (Math.random()-0.5)*1.5;
            part.rotation.x += Math.random();
            part.rotation.z += Math.random();
        }
    });

    if(car.userData.damage>7){
        scene.remove(car);
        currentCar=null;
    }
}

// ================= UPDATE =================
function update(){

    let dx=0,dz=0;

    if(keys["keyw"]) dz+=1;
    if(keys["keys"]) dz-=1;
    if(keys["keya"]) dx-=1;
    if(keys["keyd"]) dx+=1;

    const len=Math.hypot(dx,dz);
    if(len){dx/=len;dz/=len;}

    const fx=Math.sin(yaw);
    const fz=Math.cos(yaw);
    const rx=-Math.cos(yaw);
    const rz=Math.sin(yaw);

    // ================= FPS =================
    if(!currentCar){
        player.position.x += (fx*dz + rx*dx)*0.12;
        player.position.z += (fz*dz + rz*dx)*0.12;
    }

    // ================= CAR =================
    if(currentCar){

        const c=currentCar;

        if(keys["keyw"]) c.userData.speed += 0.01;
        else c.userData.speed *= 0.98;

        c.userData.speed=Math.max(0,Math.min(c.userData.speed,0.8));

        if(keys["keys"]) c.userData.speed-=0.015;

        if(keys["keya"]) c.userData.yaw += 0.03*(c.userData.speed+0.2);
        if(keys["keyd"]) c.userData.yaw -= 0.03*(c.userData.speed+0.2);

        const fx2=Math.sin(c.userData.yaw);
        const fz2=Math.cos(c.userData.yaw);

        c.position.x += fx2*c.userData.speed;
        c.position.z += fz2*c.userData.speed;

        c.rotation.y=c.userData.yaw;

        // ================= WHEELS ROTATION =================
        c.userData.wheels.forEach(w=>{
            w.rotation.x += c.userData.speed * 2;
        });

        // damage when hitting trees
        for(let i=trees.length-1;i>=0;i--){
            const t=trees[i];
            if(c.position.distanceTo(t.position)<4){

                scene.remove(t);
                trees.splice(i,1);

                damageCar(c);
            }
        }

        player.position.copy(c.position);
    }

    // ================= ENTER/EXIT =================
    if(keys["keyf"]){
        if(!currentCar){
            let nearest=null,dist=999;

            for(const c of cars){
                const d=c.position.distanceTo(player.position);
                if(d<5 && d<dist){
                    nearest=c;
                    dist=d;
                }
            }
            if(nearest) currentCar=nearest;
        } else {
            currentCar=null;
        }
    }

    // jump
    if(!currentCar && keys["space"] && grounded){
        velY=0.18;
        grounded=false;
    }

    if(!currentCar && !grounded){
        velY-=0.008;
        player.position.y+=velY;

        if(player.position.y<=2){
            player.position.y=2;
            grounded=true;
        }
    }

    // camera
    if(!currentCar) fpsCamera();
    else carCamera(currentCar);
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

// ================= WORLD =================
for(let i=0;i<120;i++){
    tree(Math.random()*300-150,Math.random()*300-150);
}

</script>
</body>
</html>
