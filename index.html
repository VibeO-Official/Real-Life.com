<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Drift Car</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad6ff);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
scene.add(new THREE.AmbientLight(0xffffff,0.6));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshStandardMaterial({color:0x2fa84a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y = 2;
scene.add(player);

// ================= INPUT =================
const keys = {};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

// ================= MOUSE =================
let yaw = 0, pitch = 0;
document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
});
document.body.onclick = () => document.body.requestPointerLock();

// ================= TREES =================
const trees=[];
function tree(x,z){
    const t=new THREE.Mesh(
        new THREE.BoxGeometry(1,3,1),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    t.position.set(x,1.5,z);
    scene.add(t);
    trees.push(t);
}

// ================= CAR =================
function createCar(x,z){

    const car = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(4,1,6),
        new THREE.MeshStandardMaterial({color:0xff0000})
    );
    body.position.y = 1;
    car.add(body);

    const wheels = [];

    function wheel(x,z){
        const w=new THREE.Mesh(
            new THREE.CylinderGeometry(0.6,0.6,0.5,16),
            new THREE.MeshStandardMaterial({color:0x111})
        );
        w.rotation.z = Math.PI/2;
        w.position.set(x,0.6,z);
        car.add(w);
        wheels.push(w);
    }

    wheel(2,3); wheel(-2,3); wheel(2,-3); wheel(-2,-3);

    car.position.set(x,0,z);

    car.userData = {
        speed:0,
        yaw:0,
        vel:new THREE.Vector3(),
        wheels
    };

    scene.add(car);
    return car;
}

const car = createCar(0,0);
let currentCar = car;

// ================= DRIFT FIX =================
function updateCar(){

    const c = currentCar;

    // ================= SPEED LIMIT FIX =================
    const MAX_SPEED = 0.35;   // ❗ нормальная скорость
    const ACC = 0.008;

    if(keys["keyw"]) c.userData.speed += ACC;
    else c.userData.speed *= 0.97;

    if(keys["keys"]) c.userData.speed -= ACC * 1.5;

    c.userData.speed = Math.max(-0.15, Math.min(MAX_SPEED, c.userData.speed));

    // ================= TURN =================
    const turn = 0.04 + Math.abs(c.userData.speed)*0.05;

    if(keys["keya"]) c.userData.yaw += turn;
    if(keys["keyd"]) c.userData.yaw -= turn;

    c.rotation.y = c.userData.yaw;

    // ================= REAL DRIFT =================
    const forward = new THREE.Vector3(
        Math.sin(c.userData.yaw),
        0,
        Math.cos(c.userData.yaw)
    );

    const right = new THREE.Vector3(
        Math.cos(c.userData.yaw),
        0,
        -Math.sin(c.userData.yaw)
    );

    // движение вперед
    const forwardMove = forward.multiplyScalar(c.userData.speed);

    // боковое скольжение (дрифт)
    const sideSlip = right.multiplyScalar(
        c.userData.speed * (keys["space"] ? 0.6 : 0.25)
    );

    // итоговая скорость
    c.userData.vel.multiplyScalar(0.9);
    c.userData.vel.add(forwardMove);
    c.userData.vel.add(sideSlip);

    c.position.add(c.userData.vel);

    // ================= WHEELS =================
    c.userData.wheels.forEach(w=>{
        w.rotation.x += c.userData.speed * 2;
    });
}

// ================= CAMERA (НЕ ТРОГАЮ) =================
function cameraFollow(){

    camera.position.copy(player.position);

    const dir = new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

// ================= UPDATE =================
function update(){

    updateCar();
    cameraFollow();
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
