<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS + Car Improved</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE (НЕ ТРОГАЮ) =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaad6ff, 40, 220);
scene.background = new THREE.Color(0xaad6ff);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER (НЕ ТРОГАЮ ГРАФИКУ) =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(80,140,60);
sun.castShadow = true;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800,800),
    new THREE.MeshStandardMaterial({color:0x2fa84a, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y = 2;
scene.add(player);

// ================= INPUT (НЕ ТРОГАЮ) =================
const keys={};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

// ================= MOUSE (НЕ ТРОГАЮ) =================
let yaw=0,pitch=0;

document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch=Math.max(-1.4,Math.min(1.4,pitch));
});

document.body.onclick=()=>document.body.requestPointerLock();

// ================= TREE (НЕ ТРОГАЮ) =================
function tree(x,z){
    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.5,3),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    trunk.position.y=1.5;
    trunk.castShadow=true;

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(2,8,8),
        new THREE.MeshStandardMaterial({color:0x1f7a2e})
    );
    leaves.position.y=3.5;
    leaves.castShadow=true;

    g.add(trunk,leaves);
    g.position.set(x,0,z);
    scene.add(g);
}

// ================= CAR =================
const car = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(4,1.5,7),
    new THREE.MeshStandardMaterial({color:0xff0000})
);
body.position.y=1.2;
car.add(body);

const glass = new THREE.Mesh(
    new THREE.BoxGeometry(3,1,3),
    new THREE.MeshStandardMaterial({color:0x99ccff,transparent:true,opacity:0.5})
);
glass.position.y=2;
car.add(glass);

// wheels
const wheels = [];
function wheel(x,z){
    const w=new THREE.Mesh(
        new THREE.CylinderGeometry(0.6,0.6,0.5,16),
        new THREE.MeshStandardMaterial({color:0x111})
    );
    w.rotation.z=Math.PI/2;
    w.position.set(x,0.6,z);
    car.add(w);
    wheels.push(w);
}
wheel(2,3); wheel(-2,3); wheel(2,-3); wheel(-2,-3);

car.position.set(20,0,20);
scene.add(car);

// ================= WORLD =================
for(let i=0;i<80;i++){
    tree(Math.random()*300-150,Math.random()*300-150);
}

// ================= PHYSICS =================
let velY=0;
let grounded=true;
const gravity=0.008;

// ================= CAR =================
let inCar=false;

let carYaw = 0;
let speed = 0;
let steer = 0;

// ✔ ЗВУК ДВИГАТЕЛЯ
const engineSound = new Audio("https://actions.google.com/sounds/v1/transportation/car_engine_idle.ogg");
engineSound.loop = true;
engineSound.volume = 0.3;

// ================= CAMERA =================
function fpsCamera(){
    camera.position.copy(player.position);

    const dir=new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

function carCamera(){
    const offset = new THREE.Vector3(
        -Math.sin(carYaw) * 7,
        3,
        -Math.cos(carYaw) * 7
    );

    camera.position.copy(car.position.clone().add(offset));
    camera.lookAt(car.position);
}

// ================= UPDATE =================
function update(){

    let dx=0,dz=0;

    if(keys["keyw"]) dz+=1;
    if(keys["keys"]) dz-=1;
    if(keys["keya"]) dx-=1;
    if(keys["keyd"]) dx+=1;

    const len=Math.hypot(dx,dz);
    if(len){dx/=len;dz/=len;}

    const fx=Math.sin(yaw);
    const fz=Math.cos(yaw);
    const rx=-Math.cos(yaw);
    const rz=Math.sin(yaw);

    // ================= FPS =================
    if(!inCar){
        player.position.x += (fx*dz + rx*dx)*0.12;
        player.position.z += (fz*dz + rz*dx)*0.12;
    }

    // ================= CAR =================
    if(inCar){

        // звук
        engineSound.play().catch(()=>{});

        // разгон
        if(keys["keyw"]) speed += 0.01;
        else speed *= 0.98;

        speed = Math.max(0, Math.min(speed, 0.7));

        if(keys["keys"]) speed -= 0.015;

        // поворот
        if(keys["keya"]) carYaw += 0.03 * (speed + 0.2);
        if(keys["keyd"]) carYaw -= 0.03 * (speed + 0.2);

        // движение
        const fx2 = Math.sin(carYaw);
        const fz2 = Math.cos(carYaw);

        car.position.x += fx2 * speed;
        car.position.z += fz2 * speed;

        car.rotation.y = carYaw;

        // колёса
        steer += (keys["keya"] ? 0.1 : keys["keyd"] ? -0.1 : 0);
        steer *= 0.8;

        wheels.forEach(w=>{
            w.rotation.y = steer;
        });

        player.position.copy(car.position);
    } else {
        engineSound.pause();
        engineSound.currentTime = 0;
    }

    // jump
    if(!inCar && keys["space"] && grounded){
        velY=0.18;
        grounded=false;
    }

    if(!inCar && !grounded){
        velY-=gravity;
        player.position.y+=velY;

        if(player.position.y<=2){
            player.position.y=2;
            grounded=true;
            velY=0;
        }
    }

    // enter/exit
    if(keys["keyf"]){
        inCar=!inCar;
        player.position.copy(car.position);
    }

    // CAMERA (НЕ ТРОГАЕМ FPS)
    if(!inCar) fpsCamera();
    else carCamera();
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
