<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS City</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 40, 200);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(80,120,50);
sun.castShadow = true;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

// ================= SKY =================
scene.background = new THREE.Color(0x87CEEB);

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600,600),
    new THREE.MeshStandardMaterial({color:0x2f8f3a})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y = 2;
scene.add(player);

// ================= INPUT =================
const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.code.toLowerCase()] = true;
});
document.addEventListener("keyup",(e)=>{
    keys[e.code.toLowerCase()] = false;
});

// ================= MOUSE =================
let yaw = 0, pitch = 0;

document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw += e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
});

document.body.onclick = ()=>document.body.requestPointerLock();

// ================= TREE =================
function tree(x,z){
    const g = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.5,3),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    trunk.position.y = 1.5;
    trunk.castShadow = true;

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2,8,8),
        new THREE.MeshStandardMaterial({color:0x1f7a2e})
    );
    leaves.position.y = 3.5;
    leaves.castShadow = true;

    g.add(trunk);
    g.add(leaves);

    g.position.set(x,0,z);
    scene.add(g);
}

// ================= BUILDING / SHOP =================
function shop(x,z){
    const g = new THREE.Group();

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(10,10,10),
        new THREE.MeshStandardMaterial({color:0x888888})
    );
    building.position.y = 5;
    building.castShadow = true;

    // дверь
    const door = new THREE.Mesh(
        new THREE.BoxGeometry(2,3,0.2),
        new THREE.MeshStandardMaterial({color:0x3b2a1a})
    );
    door.position.set(0,1.5,5.1);

    // свет внутри магазина
    const light = new THREE.PointLight(0xffcc88, 1, 30);
    light.position.set(0,6,0);

    g.add(building);
    g.add(door);
    g.add(light);

    g.position.set(x,0,z);
    scene.add(g);

    return {x,z};
}

// ================= WORLD =================
for(let i=0;i<80;i++){
    tree(Math.random()*300-150, Math.random()*300-150);
}

// магазины
const shops = [];
for(let i=0;i<8;i++){
    shops.push(shop(Math.random()*200-100, Math.random()*200-100));
}

// ================= PHYSICS =================
let velY = 0;
const gravity = 0.008;
let grounded = true;

// ================= UPDATE =================
function update(){

    const speed = keys["shiftleft"] ? 0.25 : 0.12;

    let dx=0,dz=0;

    // ✔ ПРАВИЛЬНОЕ FPS ДВИЖЕНИЕ
    if(keys["keyw"]) dz += 1;
    if(keys["keys"]) dz -= 1;
    if(keys["keya"]) dx -= 1;
    if(keys["keyd"]) dx += 1;

    const len = Math.hypot(dx,dz);
    if(len>0){ dx/=len; dz/=len; }

    const fx = Math.sin(yaw);
    const fz = Math.cos(yaw);
    const rx = Math.cos(yaw);
    const rz = -Math.sin(yaw);

    player.position.x += (fx*dz + rx*dx)*speed;
    player.position.z += (fz*dz + rz*dx)*speed;

    // jump
    if(keys["space"] && grounded){
        velY = 0.18;
        grounded=false;
    }

    if(!grounded){
        velY -= gravity;
        player.position.y += velY;

        if(player.position.y<=2){
            player.position.y=2;
            grounded=true;
            velY=0;
        }
    }

    camera.position.copy(player.position);

    const dir = new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
