<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// 🌍 сцена
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

// 📷 камера
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// 🎮 рендер
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 💡 свет
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

// 🌍 земля
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 🧍 игрок
const player = new THREE.Object3D();
player.position.set(0, 2, 0); // Начальная высота игрока над землей
scene.add(player);

// Переменные для прыжка и физики
let velocityY = 0;
const gravity = 0.01;
const jumpForce = 0.2;
const playerHeight = 2; // Высота глаз/камеры над землей
let isGrounded = true;

// Клик по экрану активирует управление мышью
document.addEventListener("click", () => {
    if (!document.pointerLockElement) {
        document.body.requestPointerLock();
    }
});

// 🎮 управление
const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;

    // Ctrl включает/выключает мышь
    if (e.key === "Control") {
        if (document.pointerLockElement) {
            document.exitPointerLock();
        } else {
            document.body.requestPointerLock();
        }
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});

// 🖱 мышь
let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", (e) => {
    if (!document.pointerLockElement) return;

    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(-1.5, Math.min(1.5, pitch));
});

// 🌳 дерево
function tree(x, z){
    const trunk = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 2, 0.5),
        new THREE.MeshLambertMaterial({ color: 0x8B4513 })
    );

    trunk.position.set(x, 1, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1),
        new THREE.MeshLambertMaterial({ color: 0x00ff00 })
    );

    leaves.position.set(x, 3, z);
    scene.add(leaves);
}

// 🌲 лес
for(let i = 0; i < 30; i++){
    tree(
        (Math.random() * 40) - 20,
        (Math.random() * 40) - 20
    );
}

// 🧠 движение
function update(){
    const speed = keys["shift"] ? 0.25 : 0.12;

    // Направление взгляда (только по горизонтали XZ для правильной ходьбы)
    const moveDir = new THREE.Vector3(0, 0, 0);

    if (keys["w"]) moveDir.z -= 1;
    if (keys["s"]) moveDir.z += 1;
    if (keys["a"]) moveDir.x -= 1;
    if (keys["d"]) moveDir.x += 1;

    moveDir.normalize();

    // Разворот вектора движения относительно угла поворота мыши (yaw)
    const rotatedX = moveDir.x * Math.cos(yaw) - moveDir.z * Math.sin(yaw);
    const rotatedZ = moveDir.x * Math.sin(yaw) + moveDir.z * Math.cos(yaw);

    // Применяем скорость ходьбы
    player.position.x += rotatedX * speed;
    player.position.z += rotatedZ * speed;

    // Логика прыжка и гравитации
    if (keys[" "] && isGrounded) {
        velocityY = jumpForce;
        isGrounded = false;
    }

    // Применяем гравитацию, если игрок в воздухе
    if (!isGrounded) {
        velocityY -= gravity;
        player.position.y += velocityY;

        // Проверка приземления на землю (Y = playerHeight)
        if (player.position.y <= playerHeight) {
            player.position.y = playerHeight;
            velocityY = 0;
            isGrounded = true;
        }
    }

    // Камера находится точно в позиции игрока (вид из глаз)
    camera.position.copy(player.position);

    // Направление взгляда камеры
    const lookDir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(lookDir));
}

// 📏 изменение окна
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🔁 цикл
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
