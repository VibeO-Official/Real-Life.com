<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City FPS</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 30, 180);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50,80,20);
sun.castShadow = true;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshStandardMaterial({color:0x2e8b57, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y = 2;
scene.add(player);

// ================= CONTROLS =================
const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.code.toLowerCase()] = true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.code.toLowerCase()] = false;
});

// ================= MOUSE =================
let yaw = 0, pitch = 0;

document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw += e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
});

document.body.onclick = ()=>document.body.requestPointerLock();

// ================= CITY =================
function building(x,z,size=1,height=10,color=0x888888){

    const b = new THREE.Mesh(
        new THREE.BoxGeometry(size,height,size),
        new THREE.MeshStandardMaterial({color})
    );

    b.position.set(x,height/2,z);
    b.castShadow = true;
    b.receiveShadow = true;

    scene.add(b);

    // окна (простая графика)
    const windowMat = new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0x333300});
    for(let i=0;i<height;i+=2){
        const w = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5), windowMat);
        w.position.set(x+size/2+0.01, i, z);
        w.rotation.y = Math.PI/2;
        scene.add(w);
    }
}

// город
for(let i=0;i<40;i++){
    building(
        (Math.random()*200-100),
        (Math.random()*200-100),
        4+Math.random()*4,
        5+Math.random()*25,
        0x666666
    );
}

// ================= MOVEMENT FIX =================
let velY=0;
const gravity=0.008;
let grounded=true;

function update(){

    const speed = keys["shiftleft"] ? 0.25 : 0.12;

    let dx=0,dz=0;

    // ✔ ИСПРАВЛЕНО: W/S больше не наоборот
    if(keys["keyw"]) dz -= 1;
    if(keys["keys"]) dz += 1;
    if(keys["keya"]) dx -= 1;
    if(keys["keyd"]) dx += 1;

    const len = Math.hypot(dx,dz);
    if(len>0){ dx/=len; dz/=len; }

    const fx = Math.sin(yaw);
    const fz = -Math.cos(yaw);
    const rx = Math.cos(yaw);
    const rz = Math.sin(yaw);

    player.position.x += (fx*dz + rx*dx)*speed;
    player.position.z += (fz*dz + rz*dx)*speed;

    // jump
    if(keys["space"] && grounded){
        velY = 0.18;
        grounded=false;
    }

    if(!grounded){
        velY -= gravity;
        player.position.y += velY;

        if(player.position.y<=2){
            player.position.y=2;
            velY=0;
            grounded=true;
        }
    }

    camera.position.copy(player.position);

    const dir = new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
