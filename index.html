<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGO Zombie Survival</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{display:block;}
#clock-hud{position:fixed;top:16px;right:16px;z-index:20;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);pointer-events:none;text-align:center;}
#clock-time{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
#clock-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:1px;}
#wave-hud{position:fixed;top:16px;left:16px;z-index:20;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid rgba(255,80,80,.25);pointer-events:none;}
#speedo-wrap{position:fixed;bottom:20px;right:20px;pointer-events:none;z-index:20;display:none;}
#speedo-canvas{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7));}
#map-btn{
  position:fixed;bottom:20px;left:20px;width:58px;height:58px;
  background:rgba(10,15,10,.85);border:2px solid rgba(80,200,80,.35);
  border-radius:14px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:#aaffaa;
  font-size:9px;font-weight:700;letter-spacing:.5px;
  backdrop-filter:blur(10px);transition:.18s;z-index:30;
}
#map-btn:hover{background:rgba(50,130,50,.55);}
#map-btn svg{width:22px;height:22px;}
#map-overlay{
  display:none;position:fixed;bottom:92px;left:20px;
  width:270px;height:270px;background:rgba(4,12,4,.94);
  border:2px solid rgba(80,200,80,.4);border-radius:16px;overflow:hidden;
  z-index:25;backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,.8);
  pointer-events:none;
}
#map-overlay.open{display:block;}
#map-title{position:absolute;top:8px;left:0;right:0;text-align:center;
  color:#66ff88;font-size:11px;font-weight:700;pointer-events:none;}
#info-hud{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.62);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:8px 22px;color:#fff;font-size:13px;font-weight:500;
  pointer-events:none;z-index:20;white-space:nowrap;
}
#drift-flash{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  color:#ff7a00;font-size:38px;font-weight:900;letter-spacing:6px;
  text-shadow:0 0 24px #ff5500,0 0 60px #ff2200;
  opacity:0;pointer-events:none;z-index:20;transition:opacity .1s;
}
#bottom-hud{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;pointer-events:none;z-index:20;
}
.hud-pill{
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16);border-radius:10px;
  padding:6px 14px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;
}
#hp-bar-wrap{display:inline-block;width:90px;height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px;}
#hp-bar{height:100%;width:100%;background:#22ee55;border-radius:4px;transition:.2s;}
#crosshair{
  position:fixed;top:50%;left:50%;
  width:16px;height:16px;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:18;display:none;
}
#crosshair::before,#crosshair::after{
  content:'';position:absolute;background:rgba(255,255,255,.9);border-radius:2px;
}
#crosshair::before{width:2px;height:16px;left:7px;top:0;}
#crosshair::after{width:16px;height:2px;top:7px;left:0;}
#shop-prompt{
  position:fixed;top:62%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  border:1px solid rgba(255,210,50,.5);border-radius:10px;
  padding:8px 20px;color:#ffe066;font-size:14px;font-weight:700;
  display:none;pointer-events:none;z-index:20;
}
#shop-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);
  z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(8px);
}
#shop-overlay.open{display:flex;}
#shop-box{
  background:#181828;border:2px solid rgba(255,200,50,.35);
  border-radius:20px;padding:28px 32px;min-width:380px;max-width:94vw;
  box-shadow:0 0 60px rgba(255,180,0,.1);
}
#shop-box h2{color:#ffe066;font-size:22px;font-weight:900;text-align:center;margin-bottom:4px;}
#shop-coins-row{color:#999;font-size:13px;text-align:center;margin-bottom:18px;}
.s-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;border-radius:12px;margin-bottom:9px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
}
.s-item-left{display:flex;align-items:center;gap:12px;}
.s-ico{font-size:26px;}
.s-name{color:#fff;font-size:15px;font-weight:700;}
.s-desc{color:#777;font-size:11px;margin-top:1px;}
.s-btn{
  background:#7c3aed;border:none;color:#fff;font-size:13px;font-weight:700;
  padding:8px 18px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.s-btn:hover{background:#9f5ff0;}
.s-btn:disabled{background:#2a2a3a;color:#555;cursor:default;}
.s-btn.owned{background:#1a5c2a;color:#5eff8a;cursor:default;}
#shop-close-btn{
  display:block;width:100%;margin-top:14px;padding:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  border-radius:10px;color:#ccc;font-size:14px;font-weight:600;cursor:pointer;
}
#shop-close-btn:hover{background:rgba(255,255,255,.13);}
#kill-feed{
  position:fixed;top:70px;right:20px;z-index:20;pointer-events:none;
  display:flex;flex-direction:column;gap:4px;align-items:flex-end;
}
.kf{
  background:rgba(0,0,0,.72);border-left:3px solid #ff3333;
  padding:4px 10px;border-radius:4px;color:#fff;font-size:11px;font-weight:600;
  animation:kfIn .18s ease both;
}
@keyframes kfIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:none;}}
#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(255,0,0,.6) 100%);
  transition:opacity .12s;
}
#night-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,30,.55) 100%);
  transition:opacity .5s;
}
#dusk-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(30,10,0,.3) 100%);
  transition:opacity .5s;
}
</style>
</head>
<body>

<div id="clock-hud"><div id="clock-time">12:00</div><div id="clock-label">ДЕНЬ</div></div>
<div id="wave-hud"><div style="color:#fff;font-size:13px;font-weight:700;">ВОЛНА <span id="wave-num">1</span></div><div style="color:#f66;font-size:11px;font-weight:600;">Зомби: <span id="zombie-num">0</span></div><div style="color:#999;font-size:11px;">Убийств: <span id="kill-num">0</span></div><div id="boss-row" style="color:#fc0;font-size:11px;font-weight:700;display:none;">Боссов: <span id="boss-num">0</span></div></div>
<div id="info-hud">WASD - движение | F - войти/выйти | Пробел - дрифт | ЛКМ - стрелять | E - магазин | 1 - оружие</div>
<div id="drift-flash">DRIFT!</div>
<div id="crosshair"></div>
<div id="vignette"></div>
<div id="night-overlay"></div>
<div id="dusk-overlay"></div>
<div id="shop-prompt">[E] Открыть магазин</div>
<div id="kill-feed"></div>

<div id="bottom-hud">
  <div class="hud-pill">&#10084;&#65039;<div id="hp-bar-wrap"><div id="hp-bar"></div></div></div>
  <div class="hud-pill" id="coins-hud">&#128176; 0</div>
  <div class="hud-pill" id="weapon-hud">&#128274; Пистолет</div>
</div>

<div id="speedo-wrap">
  <canvas id="speedo-canvas" width="190" height="190"></canvas>
</div>

<button id="map-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
    <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
  </svg>КАРТА
</button>
<div id="map-overlay">
  <div id="map-title">КАРТА</div>
  <canvas id="map-canvas" width="270" height="270"></canvas>
</div>

<div id="shop-overlay">
  <div id="shop-box">
    <h2>Магазин</h2>
    <div id="shop-coins-row">Монеты: <b id="shop-coins-val">0</b> &#128176;</div>
    <div id="shop-items-list"></div>
    <button id="shop-close-btn">&#10005; Закрыть [E]</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:sans-serif;font-size:18px;">Error: Three.js failed to load. Check your internet connection.</div>';
  throw new Error('Three.js not loaded');
}
</script>
<script>
// ════════════════════════════════════════════════
// SCENE
// ════════════════════════════════════════════════
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8fbfdf, 0.004);
scene.background = new THREE.Color(0x8fbfdf);

var camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 1200);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', function(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// LIGHTS
var sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
sun.position.set(80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near=1; sun.shadow.camera.far=400;
sun.shadow.camera.left=-130; sun.shadow.camera.right=130;
sun.shadow.camera.top=130; sun.shadow.camera.bottom=-130;
scene.add(sun);
var ambientLight = new THREE.HemisphereLight(0xadd8ff, 0x3d7a3d, 0.75);
scene.add(ambientLight);

// GROUND
var gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(800,800),
  new THREE.MeshStandardMaterial({color:0x3a9448, roughness:1})
);
gnd.rotation.x = -Math.PI/2;
gnd.receiveShadow = true;
scene.add(gnd);

// ROADS
function makeRoad(x, z, w, d, rot) {
  var rm = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({color:0x333333, roughness:0.9})
  );
  rm.rotation.x = -Math.PI/2;
  rm.rotation.z = rot || 0;
  rm.position.set(x, 0.02, z);
  rm.receiveShadow = true;
  scene.add(rm);
  for (var i = -d/2+8; i < d/2-4; i += 12) {
    var lm = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 5),
      new THREE.MeshStandardMaterial({color:0xffffff}));
    lm.rotation.x = -Math.PI/2;
    lm.rotation.z = rot || 0;
    lm.position.set(x + Math.sin(rot||0)*i, 0.03, z + Math.cos(rot||0)*i);
    scene.add(lm);
  }
}
makeRoad(0, 0, 12, 400, 0);
makeRoad(0, 0, 400, 12, Math.PI/2);

// ════════════════════════════════════════════════
// MOUNTAINS
// ════════════════════════════════════════════════
var mountainPositions = [
  {x:-350,z:-350,h:80,r:60},{x:350,z:-300,h:100,r:70},
  {x:-300,z:350,h:70,r:55},{x:380,z:350,h:90,r:65},
  {x:0,z:-380,h:120,r:80},{x:-380,z:0,h:85,r:58},
  {x:380,z:0,h:95,r:68},{x:0,z:380,h:75,r:50},
  {x:-200,z:-360,h:60,r:45},{x:250,z:370,h:65,r:48}
];
mountainPositions.forEach(function(mp){
  var g = new THREE.Group();
  var mMat = new THREE.MeshStandardMaterial({color:0x5a6e5a,roughness:0.9,flatShading:true});
  var mMesh = new THREE.Mesh(new THREE.ConeGeometry(mp.r,mp.h,8),mMat);
  mMesh.position.set(0,mp.h/2,0); mMesh.castShadow=true; mMesh.receiveShadow=true; g.add(mMesh);
  if(mp.h>70){
    var sMat = new THREE.MeshStandardMaterial({color:0xeeeeff,roughness:0.7,flatShading:true});
    var sMesh = new THREE.Mesh(new THREE.ConeGeometry(mp.r*0.35,mp.h*0.2,8),sMat);
    sMesh.position.set(0,mp.h*0.85,0); sMesh.castShadow=true; g.add(sMesh);
  }
  for(var ri=0;ri<5;ri++){
    var rMat = new THREE.MeshStandardMaterial({color:0x6a7a6a,roughness:1,flatShading:true});
    var rock = new THREE.Mesh(new THREE.DodecahedronGeometry(mp.r*0.15+Math.random()*mp.r*0.1,0),rMat);
    var rAngle=Math.random()*Math.PI*2, rDist=mp.r*0.5+Math.random()*mp.r*0.4;
    rock.position.set(Math.cos(rAngle)*rDist, mp.h*(0.2+Math.random()*0.4), Math.sin(rAngle)*rDist);
    rock.rotation.set(Math.random(),Math.random(),Math.random());
    rock.castShadow=true; g.add(rock);
  }
  g.position.set(mp.x,0,mp.z);
  scene.add(g);
});

// ════════════════════════════════════════════════
// SHOP BUILDING + VENDOR NPC
// ════════════════════════════════════════════════
var SHOP_POS = new THREE.Vector3(55, 0, 55);
(function buildShop(){
  var g = new THREE.Group();
  function M(c){ return new THREE.MeshStandardMaterial({color:c, roughness:0.6}); }
  var walls = new THREE.Mesh(new THREE.BoxGeometry(14,8,14), M(0xddbb88));
  walls.position.y=4; walls.castShadow=true; walls.receiveShadow=true; g.add(walls);
  var roof = new THREE.Mesh(new THREE.BoxGeometry(15,1,15), M(0x8b3a3a));
  roof.position.y=8.5; roof.castShadow=true; g.add(roof);
  var door = new THREE.Mesh(new THREE.BoxGeometry(2.5,4,0.3), M(0x5c3a1e));
  door.position.set(0,2,7.2); g.add(door);
  var wMat = new THREE.MeshStandardMaterial({color:0x99ddff, transparent:true, opacity:0.55});
  [-4,4].forEach(function(wx){
    var w = new THREE.Mesh(new THREE.BoxGeometry(2,2,0.2), wMat);
    w.position.set(wx,5,7.2); g.add(w);
  });
  var signMat = new THREE.MeshStandardMaterial({color:0x110022, emissive:0x660033, emissiveIntensity:0.9});
  var sign = new THREE.Mesh(new THREE.BoxGeometry(10,2,0.3), signMat);
  sign.position.set(0,7.2,7.3); g.add(sign);

  // VENDOR NPC
  var vM = function(c){return new THREE.MeshStandardMaterial({color:c,roughness:0.7});};
  var pants = new THREE.Mesh(new THREE.BoxGeometry(1,1.2,0.6),vM(0x4a3020));
  pants.position.set(0,0.6,3); pants.castShadow=true; g.add(pants);
  var shirt = new THREE.Mesh(new THREE.BoxGeometry(1.1,1.3,0.7),vM(0xf0e8d0));
  shirt.position.set(0,1.85,3); shirt.castShadow=true; g.add(shirt);
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),vM(0xffcc99));
  head.position.set(0,2.85,3); head.castShadow=true; g.add(head);
  var hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.12,8),vM(0x8b0000));
  hatBrim.position.set(0,3.27,3); g.add(hatBrim);
  var hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,0.4,8),vM(0x8b0000));
  hatTop.position.set(0,3.5,3); g.add(hatTop);
  [-0.75,0.75].forEach(function(ox,idx){
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.35,1,0.35),vM(0xf0e8d0));
    arm.position.set(ox,1.85,3);
    arm.rotation.z=(idx===0?1:-1)*0.15;
    arm.castShadow=true; g.add(arm);
  });
  var counter = new THREE.Mesh(new THREE.BoxGeometry(2.5,1.2,1),vM(0x6b3a1e));
  counter.position.set(0,0.6,4.5); counter.castShadow=true; g.add(counter);
  var wd1 = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.8,0.15),vM(0x444444));
  wd1.position.set(-0.6,1.5,4.5); wd1.rotation.z=0.3; g.add(wd1);
  var wd2 = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.6,0.12),vM(0x333333));
  wd2.position.set(0.3,1.4,4.5); wd2.rotation.z=-0.15; g.add(wd2);

  g.position.copy(SHOP_POS);
  scene.add(g);
})();

// ════════════════════════════════════════════════
// TREES
// ════════════════════════════════════════════════
var trees = [];
function addTree(x, z) {
  var g = new THREE.Group();
  var trunk = new THREE.Mesh(new THREE.BoxGeometry(1,4,1),
    new THREE.MeshStandardMaterial({color:0x5c2e0a}));
  trunk.position.y = 2; trunk.castShadow = true;
  var c1 = new THREE.Mesh(new THREE.ConeGeometry(3,5,6), new THREE.MeshStandardMaterial({color:0x1a6b28}));
  var c2 = new THREE.Mesh(new THREE.ConeGeometry(2.2,4,6), new THREE.MeshStandardMaterial({color:0x218a34}));
  var c3 = new THREE.Mesh(new THREE.ConeGeometry(1.5,3,6), new THREE.MeshStandardMaterial({color:0x27a33e}));
  c1.position.y=5.5; c2.position.y=8; c3.position.y=10;
  c1.castShadow=true; c2.castShadow=true; c3.castShadow=true;
  g.add(trunk, c1, c2, c3);
  g.position.set(x, 0, z);
  scene.add(g);
  trees.push({mesh:g, pos:new THREE.Vector3(x,0,z)});
}

// ════════════════════════════════════════════════
// DEBRIS
// ════════════════════════════════════════════════
var debris = [];
function spawnDebris(pos, color, count) {
  for (var i = 0; i < (count||14); i++) {
    var b = new THREE.Mesh(
      new THREE.BoxGeometry(0.3+Math.random()*0.5, 0.3+Math.random()*0.5, 0.3+Math.random()*0.5),
      new THREE.MeshStandardMaterial({color:color})
    );
    b.position.set(pos.x+(Math.random()-.5)*2, pos.y+Math.random()*2, pos.z+(Math.random()-.5)*2);
    b.userData.vel = new THREE.Vector3(
      (Math.random()-.5)*2.5, Math.random()*3+1, (Math.random()-.5)*2.5
    );
    b.userData.spin = new THREE.Vector3(
      (Math.random()-.5)*.12, (Math.random()-.5)*.12, (Math.random()-.5)*.12
    );
    b.userData.life = 80 + Math.random()*40;
    scene.add(b);
    debris.push(b);
  }
}
function updateDebris() {
  for (var i = debris.length-1; i >= 0; i--) {
    var b = debris[i];
    b.position.add(b.userData.vel);
    b.rotation.x += b.userData.spin.x;
    b.rotation.y += b.userData.spin.y;
    b.rotation.z += b.userData.spin.z;
    b.userData.vel.y -= 0.06;
    if (b.position.y < 0.25) {
      b.position.y = 0.25;
      b.userData.vel.y *= -0.3;
      b.userData.vel.x *= 0.75;
      b.userData.vel.z *= 0.75;
    }
    b.userData.life--;
    if (b.userData.life <= 0) { scene.remove(b); debris.splice(i,1); }
  }
}

// ════════════════════════════════════════════════
// LEGO CAR
// ════════════════════════════════════════════════
function createCar(bodyColor, x, z) {
  var g = new THREE.Group();
  function M(c){ return new THREE.MeshStandardMaterial({color:c, roughness:0.45, metalness:0.12}); }

  var bodyBase = new THREE.Mesh(new THREE.BoxGeometry(4.6,0.7,8.5), M(bodyColor));
  bodyBase.position.set(0,0.85,0); bodyBase.castShadow=true; g.add(bodyBase);
  var bodyMid = new THREE.Mesh(new THREE.BoxGeometry(4.4,0.9,8), M(bodyColor));
  bodyMid.position.set(0,1.55,0); bodyMid.castShadow=true; g.add(bodyMid);
  var hood = new THREE.Mesh(new THREE.BoxGeometry(4.2,0.5,2.8), M(bodyColor));
  hood.position.set(0,2.05,3.3); hood.castShadow=true; g.add(hood);
  var cabin = new THREE.Mesh(new THREE.BoxGeometry(4.0,1.6,4), M(bodyColor));
  cabin.position.set(0,2.55,0); cabin.castShadow=true; g.add(cabin);
  var wsMat = new THREE.MeshStandardMaterial({color:0x99ddff, transparent:true, opacity:0.45});
  var wsF = new THREE.Mesh(new THREE.BoxGeometry(3.6,1.3,0.15), wsMat);
  wsF.position.set(0,2.5,2.2); g.add(wsF);

var zombies = [];

function createZombie(x, z, isBoss) {
  isBoss = isBoss || false;
  var g = new THREE.Group();
  function M(c){ return new THREE.MeshStandardMaterial({color:c, roughness:0.8}); }
  var scale = isBoss ? 2.0 : 1.0;
  var hp = isBoss ? 30 : 3;
  var speed = isBoss ? 0.03+Math.random()*0.01 : 0.04+Math.random()*0.025;
  var legColor = isBoss ? 0x3d1e1e : 0x1e3d1e;
  var bodyCol = isBoss ? 0xcc3333 : 0x1e3d1e;
  var skinCol = isBoss ? 0xff2222 : 0x33cc44;
  var headCol = isBoss ? 0xff4444 : 0x33cc44;

  [-0.35,0.35].forEach(function(ox){
    var leg = new THREE.Mesh(new THREE.BoxGeometry(0.44*scale,1.1*scale,0.44*scale), M(legColor));
    leg.position.set(ox*scale,0.55*scale,0); leg.castShadow=true; g.add(leg);
  });
  var torso = new THREE.Mesh(new THREE.BoxGeometry(1.1*scale,1.2*scale,0.65*scale), M(bodyCol));
  torso.position.set(0,1.65*scale,0); torso.castShadow=true; g.add(torso);
  [-0.82,0.82].forEach(function(ox, idx){
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.38*scale,1*scale,0.38*scale), M(skinCol));
    arm.position.set(ox*scale,2.2*scale,0.5*scale);
    arm.rotation.x = -0.9;
    arm.rotation.z = (idx===0?1:-1)*0.2;
    arm.castShadow=true; g.add(arm);
  });
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.8*scale,0.8*scale,0.8*scale), M(headCol));
  head.position.set(0,2.75*scale,0); head.castShadow=true; g.add(head);

  if(isBoss){
    var crownMat = new THREE.MeshStandardMaterial({color:0xffaa00, emissive:0xff8800, emissiveIntensity:0.8, metalness:0.9, roughness:0.3});
    [-0.3,0.3].forEach(function(hx){
      var horn = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.6,6), crownMat);
      horn.position.set(hx*scale,3.3*scale,0);
      horn.rotation.z=(hx>0?1:-1)*0.2;
      g.add(horn);
    });
    var auraMat = new THREE.MeshBasicMaterial({color:0xff3300, transparent:true, opacity:0.15});
    var aura = new THREE.Mesh(new THREE.SphereGeometry(3*scale,8,8), auraMat);
    aura.position.set(0,1.5*scale,0); g.add(aura);
  }

  var eyeMat = new THREE.MeshStandardMaterial({
    color:isBoss?0xffff00:0xff0000,
    emissive:isBoss?0xffff00:0xff0000,
    emissiveIntensity:isBoss?2.5:1.6
  });
  [-0.2,0.2].forEach(function(ex){
    var eye = new THREE.Mesh(new THREE.BoxGeometry(0.14*scale,0.14*scale,0.05*scale), eyeMat);
    eye.position.set(ex*scale,2.8*scale,0.42*scale); g.add(eye);
  });

  g.position.set(x, 0, z);
  g.userData = {hp:hp, maxHp:hp, speed:speed, yaw:0, alive:true, attackCooldown:0, isBoss:isBoss};
  scene.add(g);
  zombies.push(g);
  return g;
}

function spawnZombies(count) {
  for (var i = 0; i < count; i++) {
    var x, z;
    do {
      x = (Math.random()-0.5)*280;
      z = (Math.random()-0.5)*280;
    } while(Math.hypot(x,z)<30);
    createZombie(x, z);
  }
}

function zombieHit(z, dmg) {
  if (!z.userData.alive) return;
  z.userData.hp -= dmg;
  z.traverse(function(m){
    if (m.isMesh && m.material && m.material.color) {
      m.material.emissive = new THREE.Color(0xff2200);
      m.material.emissiveIntensity = 1;
    }
  });
  setTimeout(function(){
    z.traverse(function(m){
      if (m.isMesh && m.material && m.material.emissiveIntensity === 1) {
        m.material.emissiveIntensity = 0;
      }
    });
  }, 120);
  if (z.userData.hp <= 0) killZombie(z);
}

function killZombie(z) {
  z.userData.alive = false;
  spawnDebris(z.position.clone().add(new THREE.Vector3(0,1.5,0)), 0x33cc44, 10);
  spawnDebris(z.position.clone().add(new THREE.Vector3(0,0.5,0)), 0x1e3d1e, 6);
  scene.remove(z);
  var idx = zombies.indexOf(z);
  if (idx !== -1) zombies.splice(idx, 1);
  var reward = z.userData.isBoss ? 100 : 10;
  coins += reward;
  totalKills++;
  if(z.userData.isBoss) killedBosses++;
  updateHUD();
  addKillFeed(z.userData.isBoss ? 'БОСС Убит! +100' : 'Убит! +10');
}

function updateZombies(playerPos) {
  for (var zi = 0; zi < zombies.length; zi++) {
    var z = zombies[zi];
    if (!z.userData.alive) continue;
    var dx = playerPos.x - z.position.x;
    var dz = playerPos.z - z.position.z;
    var dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 0.1) {
      z.userData.yaw = Math.atan2(dx, dz);
      z.rotation.y = z.userData.yaw;
      var hitR = z.userData.isBoss ? 5 : 2.5;
      if (dist > hitR) {
        z.position.x += (dx/dist) * z.userData.speed;
        z.position.z += (dz/dist) * z.userData.speed;
      } else {
        if (z.userData.attackCooldown <= 0 && !currentVehicle) {
          var dmg = z.userData.isBoss ? 20 : 8;
          playerHP = Math.max(0, playerHP - dmg);
          z.userData.attackCooldown = 60;
          flashVignette();
          updateHUD();
        }
      }
    }
    if (z.userData.attackCooldown > 0) z.userData.attackCooldown--;
    z.position.y = 0;
  }
  for (var vi = 0; vi < vehicles.length; vi++) {
    var v = vehicles[vi];
    var spd = v.userData.vel.length();
    if (spd < 0.12) continue;
    for (var zi2 = zombies.length-1; zi2 >= 0; zi2--) {
      var zz = zombies[zi2];
      if (!zz.userData.alive) continue;
      var range = v.userData.type==='bus'?6.5:4.5;
      if (v.position.distanceTo(zz.position) < range) {
        killZombie(zz);
      }
    }
  }
}

var weaponDefs = {
  pistol:  {name:'Пистолет',  icon:'🔫', bullets:1, speed:2.2, spread:0,    dmg:1, fireRate:500,  price:0,   owned:true},
  shotgun: {name:'Дробовик',  icon:'💥', bullets:6, speed:1.8, spread:0.12, dmg:1, fireRate:900,  price:50,  owned:false},
  rifle:   {name:'Автомат',   icon:'🔧', bullets:1, speed:3.0, spread:0.03, dmg:1, fireRate:130,  price:150, owned:false},
  sniper:  {name:'Снайпер',   icon:'🎯', bullets:1, speed:4.5, spread:0,    dmg:3, fireRate:1500, price:300, owned:false}
};
var currentWeapon = 'pistol';
var lastShot = 0;
var bullets = [];
var bulletMat = new THREE.MeshBasicMaterial({color:0xffee00});

function shoot() {
  if (currentVehicle) return;
  var w = weaponDefs[currentWeapon];
  if (Date.now() - lastShot < w.fireRate) return;
  lastShot = Date.now();
  for (var i = 0; i < w.bullets; i++) {
    var fx = Math.sin(yaw)*Math.cos(pitch);
    var fy = Math.sin(pitch);
    var fz = Math.cos(yaw)*Math.cos(pitch);
    var len = Math.sqrt(fx*fx+fy*fy+fz*fz);
    fx/=len; fy/=len; fz/=len;
    if (w.spread > 0) {
      fx += (Math.random()-0.5)*w.spread*2;
      fy += (Math.random()-0.5)*w.spread;
      fz += (Math.random()-0.5)*w.spread*2;
    }
    var b = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), bulletMat.clone());
    b.position.set(
      player.position.x + fx*1.5,
      player.position.y + fy*1.5,
      player.position.z + fz*1.5
    );
    b.userData.vel = new THREE.Vector3(fx*w.speed, fy*w.speed, fz*w.speed);
    b.userData.life = 80;
    b.userData.dmg  = w.dmg;
    scene.add(b);
    bullets.push(b);
  }
}

function updateBullets() {
  for (var i = bullets.length-1; i >= 0; i--) {
    var b = bullets[i];
    b.position.add(b.userData.vel);
    b.userData.vel.y -= 0.012;
    b.userData.life--;
    var hit = false;
    for (var zi = 0; zi < zombies.length; zi++) {
      var z = zombies[zi];
      if (!z.userData.alive) continue;
      var zp = z.position.clone().add(new THREE.Vector3(0,1.5*(z.userData.isBoss?2:1),0));
      var hitR = z.userData.isBoss ? 2.5 : 1.2;
      if (b.position.distanceTo(zp) < hitR) {
        zombieHit(z, b.userData.dmg);
        hit = true;
        break;
      }
    }
    if (hit || b.userData.life <= 0 || b.position.y < 0) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }
}

var shopOpen = false;

function openShop() {
  shopOpen = true;
  document.getElementById('shop-overlay').classList.add('open');
  document.exitPointerLock();
  renderShopUI();
}
function closeShop() {
  shopOpen = false;
  document.getElementById('shop-overlay').classList.remove('open');
}
function renderShopUI() {
  document.getElementById('shop-coins-val').textContent = coins;
  var list = document.getElementById('shop-items-list');
  list.innerHTML = '';
  Object.keys(weaponDefs).forEach(function(key){
    var w = weaponDefs[key];
    var isOwned = w.owned;
    var canAfford = coins >= w.price;
    var div = document.createElement('div');
    div.className = 's-item';
    div.innerHTML =
      '<div class="s-item-left">'
        +'<span class="s-ico">'+w.icon+'</span>'
        +'<div><div class="s-name">'+w.name+'</div>'
        +'<div class="s-desc">Пуль: '+w.bullets+' | Скорость: '+w.speed+' | Урон: '+w.dmg+'</div></div>'
      +'</div>'
      +'<button class="s-btn'+(isOwned?' owned':'')+((!isOwned&&!canAfford)?' disabled':'')+'" data-key="'+key+'" '+(isOwned||(!isOwned&&!canAfford)?'disabled':'')+'>'+
        (isOwned ? (currentWeapon===key?'Выбрано':'Выбрать') : (w.price===0?'Бесплатно':'💰 '+w.price))
      +'</button>';
    list.appendChild(div);
  });
  list.querySelectorAll('.s-btn:not([disabled])').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-key');
      var w = weaponDefs[key];
      if (w.owned) {
        currentWeapon = key;
        updateHUD();
        renderShopUI();
        return;
      }
      if (coins < w.price) return;
      coins -= w.price;
      w.owned = true;
      currentWeapon = key;
      updateHUD();
      renderShopUI();
    });
  });
}
document.getElementById('shop-close-btn').addEventListener('click', closeShop);

var vehicles = [
  createCar(0xff2200,  20, 20),
  createCar(0x1133ff, -20, 10),
  createBus(0, -40)
];
var currentVehicle = null;

// ════════════════════════════════════════════════
// PLAYER & INPUT
// ════════════════════════════════════════════════
var player = new THREE.Object3D();
player.position.set(0, 2, 30);
scene.add(player);

var keys = {};
document.addEventListener('keydown', function(e){
  keys[e.code]=true;

  // Key 1 - toggle weapon model
  if (e.code === 'Digit1') {
    weaponVisible = !weaponVisible;
    if (weaponViewModel) weaponViewModel.visible = weaponVisible;
  }

  // F key - enter/exit vehicle
  if (e.code === 'KeyF' && !shopOpen) {
    if (!currentVehicle) {
      var nearest = null, bestDist = 8;
      for (var i = 0; i < vehicles.length; i++) {
        var d = vehicles[i].position.distanceTo(player.position);
        if (d < bestDist) { nearest = vehicles[i]; bestDist = d; }
      }
      if (nearest) {
        currentVehicle = nearest;
        document.getElementById('speedo-wrap').style.display = 'block';
        document.getElementById('crosshair').style.display = 'none';
        if (weaponViewModel) weaponViewModel.visible = false;
      }
    } else {
      currentVehicle = null;
      document.getElementById('speedo-wrap').style.display = 'none';
      document.getElementById('crosshair').style.display = 'block';
      if (weaponViewModel) weaponViewModel.visible = weaponVisible;
    }
  }

// ════════════════════════════════════════════════
// VEHICLE PHYSICS
// ════════════════════════════════════════════════
var driftTimer = 0;

function updateVehicle(v) {
  var isBus = v.userData.type === 'bus';
  var maxRaw = isBus ? 0.65 : 0.95;
  var accel   = isBus ? 0.007 : 0.013;
  var drag    = isBus ? 0.985 : 0.975;
  var maxTurn = isBus ? 0.026 : 0.038;

  if (keys['KeyW']) v.userData.speed = Math.min(v.userData.speed+accel, maxRaw);
  else              v.userData.speed *= drag;
  if (v.userData.speed < 0) v.userData.speed = 0;

  if (keys['KeyS']) {
    if (v.userData.speed > 0.01) v.userData.speed -= accel*1.4;
    else v.userData.speed = Math.max(v.userData.speed - accel*0.6, -maxRaw*0.35);
  }

  // Steering: A=left (yaw--), D=right (yaw++)
  var turn = maxTurn * Math.min(v.userData.speed/0.25, 1);
  if (keys['KeyA']) v.userData.yaw += turn;
  if (keys['KeyD']) v.userData.yaw -= turn;

  var dirX = -Math.sin(v.userData.yaw);
  var dirZ = -Math.cos(v.userData.yaw);
  var forward = new THREE.Vector3(dirX, 0, dirZ);
  var isDrift = !isBus && keys['Space'] && v.userData.speed > 0.25;
  var grip = isDrift ? 0.68 : (isBus ? 0.87 : 0.80);

  var targetVel = forward.clone().multiplyScalar(v.userData.speed);
  v.userData.vel.lerp(targetVel, 1-grip);
  v.userData.vel.add(targetVel.clone().multiplyScalar(0.14));

  var spd = v.userData.vel.length();
  if (spd > maxRaw*1.6) v.userData.vel.multiplyScalar(maxRaw*1.6/spd);

  v.position.add(v.userData.vel);
  v.position.y = 0;
  v.rotation.y = v.userData.yaw;

  var lat = v.userData.vel.clone().sub(forward.clone().multiplyScalar(v.userData.vel.dot(forward)));
  if (!isBus && lat.length() > 0.16 && v.userData.speed > 0.3) driftTimer = 20;

  for (var i = 0; i < v.userData.wheels.length; i++) {
    var w = v.userData.wheels[i];
    w.rotation.x += v.userData.speed * (isBus?1.5:2.2);
    if (i < 2) {
      var steerTarget = keys['KeyA']?-0.35:(keys['KeyD']?0.35:0);
      w.rotation.y += (steerTarget - w.rotation.y) * 0.15;
    }
  }

  for (var ti = trees.length-1; ti >= 0; ti--) {
    var t = trees[ti];
    var range = isBus ? 6.5 : 4.5;
    if (v.position.distanceTo(t.pos) < range) {
      scene.remove(t.mesh);
      trees.splice(ti, 1);
      spawnDebris(v.position.clone().add(new THREE.Vector3(0,2,0)), 0x5c2e0a, 8);
      v.userData.damageLevel++;
      addCrack(v);
      v.userData.speed *= 0.35;
      v.userData.vel.multiplyScalar(0.25);
    }
  }

  v.position.x = Math.max(-395, Math.min(395, v.position.x));
  v.position.z = Math.max(-395, Math.min(395, v.position.z));
}

function fpsCamera() {
  camera.position.copy(player.position);
  var tx = player.position.x - Math.sin(yaw)*Math.cos(pitch);
  var ty = player.position.y + Math.sin(pitch);
  var tz = player.position.z - Math.cos(yaw)*Math.cos(pitch);
  camera.lookAt(tx, ty, tz);
}

function vehicleCamera(v) {
  var bd = v.userData.type==='bus' ? 14 : 10;
  var ht = v.userData.type==='bus' ? 6  : 4;
  camera.position.set(
    v.position.x + Math.sin(v.userData.yaw)*bd,
    v.position.y + ht,
    v.position.z + Math.cos(v.userData.yaw)*bd
  );
  camera.lookAt(v.position.x, v.position.y+2, v.position.z);
}

// ════════════════════════════════════════════════
// DAY/NIGHT CYCLE
// ════════════════════════════════════════════════
var DAY_LENGTH = 240; // seconds for full cycle
var gameClock = 0;
var lastFrameTime = performance.now();

function getTimeOfDay(clock) {
  return (clock % DAY_LENGTH) / DAY_LENGTH;
}
function getGameHour(clock) {
  return getTimeOfDay(clock) * 24;
}
function getSkyBrightness(tod) {
  if (tod >= 0.3 && tod < 0.7) return 1.0;
  if (tod >= 0.75 || tod < 0.25) return 0.08;
  if (tod >= 0.25 && tod < 0.3) return 0.08 + ((tod-0.25)/0.05)*0.92;
  return 1.0 - ((tod-0.7)/0.05)*0.92;
}

function updateDayNight() {
  var tod = getTimeOfDay(gameClock);
  var brightness = getSkyBrightness(tod);
  var dayColor = new THREE.Color(0x8fbfdf);
  var nightColor = new THREE.Color(0x0a0a1a);
  var skyColor = dayColor.clone().lerp(nightColor, 1-brightness);
  scene.background.copy(skyColor);
  scene.fog.color.copy(skyColor);
  sun.intensity = 0.1 + brightness*1.9;
  ambientLight.intensity = 0.15 + brightness*0.6;
  renderer.toneMappingExposure = 0.4 + brightness*0.7;
  scene.fog.density = 0.004 + (1-brightness)*0.008;

  var hour = getGameHour(gameClock);
  var isNight = hour >= 19 || hour < 6;
  var isDusk = hour >= 17 && hour < 19;
  var nightEl = document.getElementById('night-overlay');
  var duskEl = document.getElementById('dusk-overlay');
  nightEl.style.opacity = isNight ? '1' : '0';
  duskEl.style.opacity = isDusk ? '1' : '0';

  var clockEl = document.getElementById('clock-time');
  var labelEl = document.getElementById('clock-label');
  var h = Math.floor(hour) % 24;
  var m = Math.floor((hour%1)*60);
  clockEl.textContent = (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  if(isNight){ clockEl.style.color='#8888ff'; labelEl.textContent='НОЧЬ'; labelEl.style.color='#6666cc'; }
  else if(isDusk){ clockEl.style.color='#ffaa44'; labelEl.textContent='СУМЕРКИ'; labelEl.style.color='#cc8833'; }
  else{ clockEl.style.color='#fff'; labelEl.textContent='ДЕНЬ'; labelEl.style.color='#aaa'; }
}

var wave = 1;

var totalKills = 0;

function updateWaves(deltaSec) {
  waveTimer += deltaSec;
  if (zombies.length === 0 && waveTimer > 3) {
    wave++;
    waveTimer = 0;
    var zombieCount = Math.min(8 + wave*4, 60);
    spawnZombies(zombieCount);
    if (wave % 5 === 0 && !bossSpawned) {
      var bx, bz;
      do {
        bx = (Math.random()-0.5)*200;
        bz = (Math.random()-0.5)*200;
      } while(Math.hypot(bx,bz)<50);
      createZombie(bx, bz, true);
      bossSpawned = true;
    }
    if (wave % 5 !== 0) bossSpawned = false;
    updateHUD();
  }
}

// SPEEDOMETER
// ════════════════════════════════════════════════
var sCanvas = document.getElementById('speedo-canvas');
var sCtx    = sCanvas.getContext('2d');

function drawSpeedometer(kmh, maxKmh) {
  sCtx.clearRect(0,0,190,190);
  var cx=95, cy=100, R=78;
  var sa=Math.PI*0.75, sw=Math.PI*1.5;
  sCtx.beginPath(); sCtx.arc(cx,cy,R+10,0,Math.PI*2);
  var bg = sCtx.createRadialGradient(cx,cy,R-12,cx,cy,R+10);
  bg.addColorStop(0,'rgba(18,18,28,.97)'); bg.addColorStop(1,'rgba(4,4,8,.99)');
  sCtx.fillStyle=bg; sCtx.fill();
  var zones = [{f:0,t:0.6,c:'#00cc44'},{f:0.6,t:0.85,c:'#ffaa00'},{f:0.85,t:1,c:'#ff2200'}];
  for (var z=0; z<zones.length; z++) {
    sCtx.beginPath(); sCtx.arc(cx,cy,R, sa+sw*zones[z].f, sa+sw*zones[z].t);
    sCtx.strokeStyle=zones[z].c; sCtx.lineWidth=7; sCtx.stroke();
  }
  var nm = maxKmh===70 ? 7 : 12;
  for (var i=0; i<=nm; i++) {
    var angle = sa + sw*(i/nm);
    sCtx.beginPath();
    sCtx.moveTo(cx+Math.cos(angle)*(R-9), cy+Math.sin(angle)*(R-9));
    sCtx.lineTo(cx+Math.cos(angle)*(R-1), cy+Math.sin(angle)*(R-1));
    sCtx.strokeStyle='rgba(255,255,255,.65)'; sCtx.lineWidth=2; sCtx.stroke();
    sCtx.fillStyle='rgba(200,200,220,.8)'; sCtx.font='bold 9px Segoe UI';
    sCtx.textAlign='center'; sCtx.textBaseline='middle';
    sCtx.fillText(Math.round((i/nm)*maxKmh), cx+Math.cos(angle)*(R-18), cy+Math.sin(angle)*(R-18));
  }
  var ratio = Math.min(kmh/maxKmh, 1);
  var na = sa + sw*ratio;
  sCtx.save(); sCtx.translate(cx, cy); sCtx.rotate(na);
  var ng = sCtx.createLinearGradient(0,-R+6,0,12);
  ng.addColorStop(0,'#ff4400'); ng.addColorStop(1,'#cc1100');
  sCtx.fillStyle=ng;
  sCtx.beginPath(); sCtx.moveTo(-2.5,12); sCtx.lineTo(2.5,12);
  sCtx.lineTo(1.2,-R+6); sCtx.lineTo(-1.2,-R+6); sCtx.closePath(); sCtx.fill();
  sCtx.restore();
  sCtx.beginPath(); sCtx.arc(cx,cy,9,0,Math.PI*2);
  var cg = sCtx.createRadialGradient(cx-3,cy-3,1,cx,cy,9);
  cg.addColorStop(0,'#888'); cg.addColorStop(1,'#222');
  sCtx.fillStyle=cg; sCtx.fill();
  sCtx.fillStyle='rgba(0,0,0,.72)'; sCtx.fillRect(cx-28, cy+18, 56, 28);
  sCtx.fillStyle = kmh>maxKmh*.85?'#ff4400':kmh>maxKmh*.6?'#ffaa00':'#00ff66';
  sCtx.font='bold 20px Segoe UI'; sCtx.textAlign='center'; sCtx.textBaseline='middle';
  sCtx.fillText(Math.round(kmh), cx, cy+32);
  sCtx.fillStyle='rgba(150,150,180,.7)'; sCtx.font='bold 8px Segoe UI';
  sCtx.fillText('КМ/Ч', cx, cy+48);
}

// MAP
// ════════════════════════════════════════════════
var mCanvas = document.getElementById('map-canvas');
var mCtx    = mCanvas.getContext('2d');
var MW=270, MSCALE=270/800, MOFF=135;
var mapOpen = false;

document.getElementById('map-btn').addEventListener('click', function(){
  mapOpen = !mapOpen;
  document.getElementById('map-overlay').classList.toggle('open', mapOpen);
});

function drawMap() {
  mCtx.clearRect(0,0,MW,MW);
  mCtx.fillStyle='#0a1a0a'; mCtx.fillRect(0,0,MW,MW);
  mCtx.fillStyle='#1a4a1a'; mCtx.fillRect(4,4,MW-8,MW-8);

  var rv = 6*MSCALE;
  mCtx.fillStyle='#2a2a2a';
  mCtx.fillRect(MOFF-rv/2, 4, rv, MW-8);
  mCtx.fillRect(4, MOFF-rv/2, MW-8, rv);

  // Mountains on map
  mCtx.fillStyle='rgba(100,120,100,.5)';
  mountainPositions.forEach(function(mp){
    mCtx.beginPath();
    mCtx.arc(mp.x*MSCALE+MOFF, mp.z*MSCALE+MOFF, 6, 0, Math.PI*2);
    mCtx.fill();
  });

  // Shop
  var sx=SHOP_POS.x*MSCALE+MOFF, sz=SHOP_POS.z*MSCALE+MOFF;
  mCtx.fillStyle='#ffcc44';
  mCtx.fillRect(sx-5,sz-5,10,10);
  mCtx.fillStyle='#fff'; mCtx.font='8px Segoe UI'; mCtx.textAlign='center';
  mCtx.fillText('SHOP', sx, sz-7);

  // Trees
  mCtx.fillStyle='rgba(50,160,50,.4)';
  for (var i=0;i<trees.length;i++) {
    mCtx.beginPath();
    mCtx.arc(trees[i].pos.x*MSCALE+MOFF, trees[i].pos.z*MSCALE+MOFF, 1.5, 0, Math.PI*2);
    mCtx.fill();
  }

  // Zombies
  for (var zi=0;zi<zombies.length;zi++) {
    mCtx.fillStyle = zombies[zi].userData.isBoss ? '#ff4444' : '#44ff44';
    mCtx.beginPath();
    mCtx.arc(zombies[zi].position.x*MSCALE+MOFF, zombies[zi].position.z*MSCALE+MOFF, zombies[zi].userData.isBoss?5:2.5, 0, Math.PI*2);
    mCtx.fill();
  }

  // Player
  if (!currentVehicle) {
    mCtx.fillStyle='#fff';
    mCtx.beginPath();
    mCtx.arc(player.position.x*MSCALE+MOFF, player.position.z*MSCALE+MOFF, 4, 0, Math.PI*2);
    mCtx.fill();
  }

  // Vehicles
  var vColors=['#ff4400','#2255ff','#ffcc00'];
  for (var vi=0;vi<vehicles.length;vi++) {
    var v=vehicles[vi];
    var mx=v.position.x*MSCALE+MOFF, mz=v.position.z*MSCALE+MOFF;
    mCtx.save(); mCtx.translate(mx,mz); mCtx.rotate(-v.userData.yaw);
    mCtx.fillStyle=vColors[vi];
    if(v===currentVehicle){mCtx.shadowColor=vColors[vi];mCtx.shadowBlur=10;}
    mCtx.beginPath(); mCtx.moveTo(0,-8); mCtx.lineTo(-5,6); mCtx.lineTo(5,6);
    mCtx.closePath(); mCtx.fill();
    if(v===currentVehicle){mCtx.strokeStyle='#fff';mCtx.lineWidth=1.5;mCtx.stroke();}
    mCtx.restore();
  }

  mCtx.fillStyle='rgba(255,255,255,.5)'; mCtx.font='bold 10px Segoe UI';
  mCtx.textAlign='center'; mCtx.fillText('N', MW/2, 14);
}

// ════════════════════════════════════════════════
// MAIN UPDATE
// ════════════════════════════════════════════════
function update() {
  var now = performance.now();
  var deltaMs = now - lastFrameTime;
  lastFrameTime = now;
  var deltaSec = deltaMs / 1000;

  if (shopOpen) return;

  // Game clock (1 real sec = 10 game sec)
  gameClock += deltaSec * 10;

  // Day/Night
  updateDayNight();

  // Shoot
  if (shootHeld && !currentVehicle && document.pointerLockElement) shoot();

  // Vehicle
  if (currentVehicle) updateVehicle(currentVehicle);

  // FPS walking — FIXED strafe direction
  if (!currentVehicle) {
    var dx=0, dz=0;
    if (keys['KeyW']) dz+=1;
    if (keys['KeyS']) dz-=1;
    if (keys['KeyA']) dx-=1;
    if (keys['KeyD']) dx+=1;
    var len2 = Math.sqrt(dx*dx+dz*dz);
    if (len2>0) { dx/=len2; dz/=len2; }

    // Forward: (sin(yaw), 0, cos(yaw))
    // Right strafe: (cos(yaw), 0, -sin(yaw))
    var fwdX = -Math.sin(yaw);
    var fwdZ = -Math.cos(yaw);
    var rgtX = Math.cos(yaw);
    var rgtZ = -Math.sin(yaw);

    player.position.x += (fwdX*dz + rgtX*dx) * 0.13;
    player.position.z += (fwdZ*dz + rgtZ*dx) * 0.13;
    player.position.x = Math.max(-395, Math.min(395, player.position.x));
    player.position.z = Math.max(-395, Math.min(395, player.position.z));
  } else {
    player.position.copy(currentVehicle.position);
  }

  // Zombies
  updateZombies(player.position);

  // Bullets
  updateBullets();

  // Debris
  updateDebris();

  // Waves
  updateWaves(deltaSec);

  // Speedometer
  if (currentVehicle) {
    var rawSpd = currentVehicle.userData.vel.length();
    var mxRaw  = currentVehicle.userData.type==='bus' ? 0.65 : 0.95;
    drawSpeedometer(rawSpd * (currentVehicle.userData.maxSpeedKmh/mxRaw), currentVehicle.userData.maxSpeedKmh);
  }

  // Drift flash
  var driftEl = document.getElementById('drift-flash');
  if (driftTimer > 0) {
    driftTimer--;
    driftEl.style.opacity='1';
  } else {
    driftEl.style.opacity='0';
  }

  // Map
  if (mapOpen) drawMap();

  // Shop proximity
  var shopDist = player.position.distanceTo(SHOP_POS);
  document.getElementById('shop-prompt').style.display =
    (!currentVehicle && shopDist < 12) ? 'block' : 'none';

  // Camera
  if (!currentVehicle) fpsCamera(); else vehicleCamera(currentVehicle);

  // HP regen
  if (playerHP < 100 && zombies.length === 0) {
    playerHP = Math.min(100, playerHP + 0.02);
  }
}
