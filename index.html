<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGO DAMAGE FIX</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaad6ff, 40, 220);
scene.background = new THREE.Color(0xaad6ff);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(80,140,60);
sun.castShadow = true;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,0.4));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800,800),
    new THREE.MeshStandardMaterial({color:0x2fa84a})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y=2;
scene.add(player);

// ================= INPUT =================
const keys={};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

// ================= MOUSE =================
let yaw=0,pitch=0;
document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw-=e.movementX*0.002;
    pitch-=e.movementY*0.002;
    pitch=Math.max(-1.4,Math.min(1.4,pitch));
});
document.body.onclick=()=>document.body.requestPointerLock();

// ================= TREES =================
const trees=[];

function tree(x,z){
    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.BoxGeometry(1,3,1),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    trunk.position.y=1.5;

    const leaves=new THREE.Mesh(
        new THREE.BoxGeometry(3,3,3),
        new THREE.MeshStandardMaterial({color:0x1f7a2e})
    );
    leaves.position.y=4;

    g.add(trunk,leaves);
    g.position.set(x,0,z);

    scene.add(g);
    trees.push(g);
}

// ================= LEGO CAR (BIG STRUCTURE) =================
function createLegoCar(color,x,z){

    const car=new THREE.Group();

    const bricks=[];
    const flyingBricks=[];

    const size=5;

    // 🔴 НАСТОЯЩАЯ LEGO-СТРУКТУРА (МНОГО КУБИКОВ)
    for(let i=0;i<40;i++){

        const b=new THREE.Mesh(
            new THREE.BoxGeometry(0.8,0.8,0.8),
            new THREE.MeshStandardMaterial({
                color,
                roughness:0.6
            })
        );

        b.position.set(
            (Math.random()-0.5)*size,
            1+(Math.random()*2),
            (Math.random()-0.5)*size
        );

        car.add(b);
        bricks.push(b);
    }

    // 🔵 СТЕКЛО (НЕ ТРОГАЮ)
    const glass=new THREE.Mesh(
        new THREE.BoxGeometry(3.5,1.5,3),
        new THREE.MeshStandardMaterial({
            color:0x99ccff,
            transparent:true,
            opacity:0.4
        })
    );
    glass.position.y=2;
    car.add(glass);

    // ⚫ КОЛЁСА
    const wheels=[];
    function wheel(x,z){
        const w=new THREE.Mesh(
            new THREE.CylinderGeometry(0.6,0.6,0.5,16),
            new THREE.MeshStandardMaterial({color:0x111})
        );
        w.rotation.z=Math.PI/2;
        w.position.set(x,0.6,z);
        car.add(w);
        wheels.push(w);
    }

    wheel(2,3); wheel(-2,3); wheel(2,-3); wheel(-2,-3);

    car.position.set(x,0,z);

    car.userData={
        speed:0,
        yaw:0,
        wheels,
        bricks,
        flyingBricks,
        damage:0
    };

    scene.add(car);
    return car;
}

// ================= CARS =================
const cars=[
    createLegoCar(0xff0000,20,20),
    createLegoCar(0x3333ff,-20,10)
];

let currentCar=null;

// ================= LEGO BREAK SYSTEM =================
function legoBreak(car){

    car.userData.damage++;

    // 🔥 часть кубиков становится "летающими"
    for(let i=0;i<10;i++){

        const b=car.userData.bricks[Math.floor(Math.random()*car.userData.bricks.length)];

        if(!b) continue;

        car.remove(b);

        scene.add(b);

        b.userData.velocity=new THREE.Vector3(
            (Math.random()-0.5)*0.5,
            Math.random()*0.6,
            (Math.random()-0.5)*0.5
        );

        car.userData.flyingBricks.push(b);
    }

    // если сильно разбита — уничтожаем
    if(car.userData.damage>8){
        scene.remove(car);
        currentCar=null;
    }
}

// ================= UPDATE FLYING BRICKS =================
function updateFlying(){

    cars.forEach(c=>{
        c.userData.flyingBricks.forEach(b=>{
            b.position.add(b.userData.velocity);
            b.userData.velocity.y -= 0.02;
        });
    });

}

// ================= PHYSICS =================
let velY=0;
let grounded=true;

// ================= CAMERA =================
function fpsCamera(){
    camera.position.copy(player.position);

    const dir=new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

function carCamera(car){
    const offset=new THREE.Vector3(
        -Math.sin(car.userData.yaw)*8,
        3,
        -Math.cos(car.userData.yaw)*8
    );

    camera.position.copy(car.position.clone().add(offset));
    camera.lookAt(car.position);
}

// ================= UPDATE =================
function update(){

    let dx=0,dz=0;

    if(keys["keyw"]) dz+=1;
    if(keys["keys"]) dz-=1;
    if(keys["keya"]) dx-=1;
    if(keys["keyd"]) dx+=1;

    const len=Math.hypot(dx,dz);
    if(len){dx/=len;dz/=len;}

    const fx=Math.sin(yaw);
    const fz=Math.cos(yaw);
    const rx=-Math.cos(yaw);
    const rz=Math.sin(yaw);

    // ================= FPS =================
    if(!currentCar){
        player.position.x += (fx*dz + rx*dx)*0.12;
        player.position.z += (fz*dz + rz*dx)*0.12;
    }

    // ================= CAR =================
    if(currentCar){

        const c=currentCar;

        if(keys["keyw"]) c.userData.speed += 0.01;
        else c.userData.speed *= 0.98;

        c.userData.speed=Math.max(0,Math.min(c.userData.speed,0.85));

        if(keys["keys"]) c.userData.speed-=0.015;

        if(keys["keya"]) c.userData.yaw += 0.03*(c.userData.speed+0.2);
        if(keys["keyd"]) c.userData.yaw -= 0.03*(c.userData.speed+0.2);

        const fx2=Math.sin(c.userData.yaw);
        const fz2=Math.cos(c.userData.yaw);

        c.position.x += fx2*c.userData.speed;
        c.position.z += fz2*c.userData.speed;

        c.rotation.y=c.userData.yaw;

        // wheels rotate
        c.userData.wheels.forEach(w=>{
            w.rotation.x += c.userData.speed*2;
        });

        // TREE COLLISION
        for(let i=trees.length-1;i>=0;i--){
            const t=trees[i];

            if(c.position.distanceTo(t.position)<4){

                scene.remove(t);
                trees.splice(i,1);

                legoBreak(c);
            }
        }

        player.position.copy(c.position);
    }

    // ================= ENTER =================
    if(keys["keyf"]){
        if(!currentCar){
            let nearest=null,dist=999;

            for(const c of cars){
                const d=c.position.distanceTo(player.position);
                if(d<5 && d<dist){
                    nearest=c;
                    dist=d;
                }
            }
            if(nearest) currentCar=nearest;
        } else {
            currentCar=null;
        }
    }

    // jump
    if(!currentCar && keys["space"] && grounded){
        velY=0.18;
        grounded=false;
    }

    if(!currentCar && !grounded){
        velY-=0.008;
        player.position.y+=velY;

        if(player.position.y<=2){
            player.position.y=2;
            grounded=true;
        }
    }

    updateFlying();

    // camera
    if(!currentCar) fpsCamera();
    else carCamera(currentCar);
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

// ================= WORLD =================
for(let i=0;i<120;i++){
    tree(Math.random()*300-150,Math.random()*300-150);
}

</script>
</body>
</html>
