<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Style FPS</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= SCENE (НЕ ТРОГАЮ) =================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaad6ff, 40, 220);
scene.background = new THREE.Color(0xaad6ff);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// ================= RENDER (НЕ ТРОГАЮ ГРАФИКУ) =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(80,140,60);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.4));

// ================= GROUND =================
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800,800),
    new THREE.MeshStandardMaterial({color:0x2fa84a})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ================= PLAYER =================
const player = new THREE.Object3D();
player.position.y=2;
scene.add(player);

// ================= INPUT (НЕ ТРОГАЮ) =================
const keys={};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

// ================= MOUSE (НЕ ТРОГАЮ) =================
let yaw=0,pitch=0;
document.addEventListener("mousemove",(e)=>{
    if(!document.pointerLockElement) return;
    yaw-=e.movementX*0.002;
    pitch-=e.movementY*0.002;
    pitch=Math.max(-1.4,Math.min(1.4,pitch));
});
document.body.onclick=()=>document.body.requestPointerLock();

// ================= TREE =================
const trees=[];

function tree(x,z){
    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.5,3),
        new THREE.MeshStandardMaterial({color:0x6b3e1d})
    );
    trunk.position.y=1.5;

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(2,8,8),
        new THREE.MeshStandardMaterial({color:0x1f7a2e})
    );
    leaves.position.y=3.5;

    g.add(trunk,leaves);
    g.position.set(x,0,z);

    scene.add(g);

    trees.push(g);
}

// ================= CARS =================
function createCar(color,x,z,type,soundUrl){
    const car=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(type==="bus"?6:4,1.5,type==="bus"?10:7),
        new THREE.MeshStandardMaterial({color})
    );
    body.position.y=1.2;
    car.add(body);

    // колёса (вернули!)
    const wheels=[];
    function wheel(x,z){
        const w=new THREE.Mesh(
            new THREE.CylinderGeometry(0.6,0.6,0.5,16),
            new THREE.MeshStandardMaterial({color:0x111})
        );
        w.rotation.z=Math.PI/2;
        w.position.set(x,0.6,z);
        car.add(w);
        wheels.push(w);
    }

    wheel(2,3); wheel(-2,3); wheel(2,-3); wheel(-2,-3);

    car.position.set(x,0,z);

    car.userData={
        type,
        speed:0,
        yaw:0,
        wheels,
        sound:new Audio(soundUrl)
    };

    car.userData.sound.loop=true;
    car.userData.sound.volume=0.3;

    scene.add(car);
    return car;
}

// разные машины + разные звуки
const cars=[
    createCar(0xff0000,20,20,"sport","https://actions.google.com/sounds/v1/transportation/car_engine_idle.ogg"),
    createCar(0x3333ff,-20,20,"bus","https://actions.google.com/sounds/v1/transportation/bus_drive.ogg")
];

let currentCar=null;

// ================= PHYSICS =================
let velY=0;
let grounded=true;

// ================= CAMERA =================
function fpsCamera(){
    camera.position.copy(player.position);

    const dir=new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw)*Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(dir));
}

function carCamera(car){
    const offset=new THREE.Vector3(
        -Math.sin(car.userData.yaw)*8,
        3,
        -Math.cos(car.userData.yaw)*8
    );

    camera.position.copy(car.position.clone().add(offset));
    camera.lookAt(car.position);
}

// ================= COLLISION =================
function checkTreeHit(car){
    for(let i=trees.length-1;i>=0;i--){
        const t=trees[i];
        if(car.position.distanceTo(t.position)<4){

            // дерево ломается
            scene.remove(t);
            trees.splice(i,1);

            // отталкивание
            car.userData.speed*=0.5;
        }
    }
}

// ================= UPDATE =================
function update(){

    let dx=0,dz=0;

    if(keys["keyw"]) dz+=1;
    if(keys["keys"]) dz-=1;
    if(keys["keya"]) dx-=1;
    if(keys["keyd"]) dx+=1;

    const len=Math.hypot(dx,dz);
    if(len){dx/=len;dz/=len;}

    const fx=Math.sin(yaw);
    const fz=Math.cos(yaw);
    const rx=-Math.cos(yaw);
    const rz=Math.sin(yaw);

    // ================= FPS =================
    if(!currentCar){
        player.position.x += (fx*dz + rx*dx)*0.12;
        player.position.z += (fz*dz + rz*dx)*0.12;
    }

    // ================= CAR =================
    if(currentCar){

        const c=currentCar;
        const u=c.userData;

        // звук
        u.sound.play().catch(()=>{});

        // разгон
        if(keys["keyw"]) u.speed += 0.01;
        else u.speed *= 0.98;

        u.speed=Math.max(0,Math.min(u.speed,u.type==="bus"?0.5:0.8));

        if(keys["keys"]) u.speed-=0.015;

        // поворот
        if(keys["keya"]) u.yaw += 0.03*(u.speed+0.2);
        if(keys["keyd"]) u.yaw -= 0.03*(u.speed+0.2);

        const fx2=Math.sin(u.yaw);
        const fz2=Math.cos(u.yaw);

        c.position.x += fx2*u.speed;
        c.position.z += fz2*u.speed;

        c.rotation.y=u.yaw;

        // колёса вращаются
        u.wheels.forEach(w=>{
            w.rotation.y += u.speed;
        });

        player.position.copy(c.position);

        // столкновения с деревьями
        checkTreeHit(c);
    } else {
        cars.forEach(c=>c.userData.sound.pause());
    }

    // jump
    if(!currentCar && keys["space"] && grounded){
        velY=0.18;
        grounded=false;
    }

    if(!currentCar && !grounded){
        velY-=0.008;
        player.position.y+=velY;

        if(player.position.y<=2){
            player.position.y=2;
            grounded=true;
        }
    }

    // enter/exit
    if(keys["keyf"]){
        if(!currentCar) currentCar=cars[0];
        else currentCar=null;
    }

    // CAMERA
    if(!currentCar) fpsCamera();
    else carCamera(currentCar);
}

// ================= LOOP =================
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

// ================= WORLD =================
for(let i=0;i<100;i++){
    tree(Math.random()*300-150,Math.random()*300-150);
}

</script>
</body>
</html>
