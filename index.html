<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next-Gen Mini Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
}
canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// 🌍 СЦЕНА
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

// 📷 КАМЕРА
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// 🎮 РЕНДЕР + ТЕНИ
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// 💡 СВЕТ
const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
sunLight.position.set(50, 80, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;

const d = 60;
sunLight.shadow.camera.left = -d;
sunLight.shadow.camera.right = d;
sunLight.shadow.camera.top = d;
sunLight.shadow.camera.bottom = -d;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 200;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
scene.add(hemiLight);

// 🌌 НЕБО
const sky = new THREE.Mesh(
    new THREE.SphereGeometry(500, 32, 15),
    new THREE.MeshBasicMaterial({ color: 0x7ec0ee, side: THREE.BackSide })
);
scene.add(sky);

// 🌍 ЗЕМЛЯ (с рельефом)
const groundGeo = new THREE.PlaneGeometry(300, 300, 64, 64);
const pos = groundGeo.attributes.position;

for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    pos.setZ(i,
        Math.sin(x * 0.2) * 0.2 +
        Math.cos(y * 0.2) * 0.2
    );
}

groundGeo.computeVertexNormals();

const ground = new THREE.Mesh(
    groundGeo,
    new THREE.MeshStandardMaterial({
        color: 0x2e5c1e,
        roughness: 0.95,
        metalness: 0.05
    })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 🧍 ИГРОК
const player = new THREE.Object3D();
player.position.set(0, 2, 0);
scene.add(player);

camera.position.copy(player.position);

// ⚙️ ФИЗИКА
let velocityY = 0;
const gravity = 0.007;
const jumpForce = 0.18;
const playerHeight = 2;
let isGrounded = true;

// 🎮 УПРАВЛЕНИЕ
const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.code.toLowerCase()] = true;

    if (e.code.toLowerCase() === "controlleft" || e.code.toLowerCase() === "controlright") {
        if (document.pointerLockElement) {
            document.exitPointerLock();
        } else {
            document.body.requestPointerLock();
        }
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.code.toLowerCase()] = false;
});

document.addEventListener("click", () => {
    if (!document.pointerLockElement) {
        document.body.requestPointerLock();
    }
});

// 🖱 МЫШЬ (исправлено)
let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", (e) => {
    if (!document.pointerLockElement) return;

    yaw += e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(-1.4, Math.min(1.4, pitch));
});

// 🌲 ДЕРЕВЬЯ
function tree(x, z) {
    const group = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.4, 2.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x5a3d28 })
    );
    trunk.position.y = 1.25;
    trunk.castShadow = true;

    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e592f });

    for (let i = 0; i < 3; i++) {
        const leaves = new THREE.Mesh(
            new THREE.SphereGeometry(1.2 - i * 0.2, 8, 8),
            leavesMat
        );
        leaves.position.y = 2.3 + i * 0.8;
        leaves.castShadow = true;
        group.add(leaves);
    }

    group.add(trunk);
    group.position.set(x, 0, z);

    scene.add(group);
}

for (let i = 0; i < 45; i++) {
    tree(Math.random() * 80 - 40, Math.random() * 80 - 40);
}

// 🧠 ЛОГИКА ДВИЖЕНИЯ
function update() {

    const speed = keys["shiftleft"] ? 0.22 : 0.11;

    let dx = 0;
    let dz = 0;

    // ✅ ИСПРАВЛЕНО W/S
    if (keys["keyw"]) dz -= 1;
    if (keys["keys"]) dz += 1;
    if (keys["keya"]) dx -= 1;
    if (keys["keyd"]) dx += 1;

    const len = Math.sqrt(dx * dx + dz * dz);
    if (len > 0) {
        dx /= len;
        dz /= len;
    }

    const forwardX = Math.sin(yaw);
    const forwardZ = -Math.cos(yaw);
    const rightX = Math.cos(yaw);
    const rightZ = Math.sin(yaw);

    player.position.x += (forwardX * dz + rightX * dx) * speed;
    player.position.z += (forwardZ * dz + rightZ * dx) * speed;

    // 🦘 ПРЫЖОК
    if (keys["space"] && isGrounded) {
        velocityY = jumpForce;
        isGrounded = false;
    }

    if (!isGrounded) {
        velocityY -= gravity;
        player.position.y += velocityY;

        if (player.position.y <= playerHeight) {
            player.position.y = playerHeight;
            velocityY = 0;
            isGrounded = true;
        }
    }

    camera.position.copy(player.position);

    const lookDir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(lookDir));
}

// 📏 RESIZE
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🔁 LOOP
function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
