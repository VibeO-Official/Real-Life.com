<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<script src="https://jsdelivr.net"></script>

<script>

// 🌍 сцена
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

// 📷 камера
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// 🎮 рендер
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 💡 свет
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

// 🌍 земля
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 🧍 игрок
const player = new THREE.Object3D();
player.position.set(0, 2, 0);
scene.add(player);

// Начальное положение камеры
camera.position.copy(player.position);

// Физика прыжка
let velocityY = 0;
const gravity = 0.008;
const jumpForce = 0.18;
const playerHeight = 2;
let isGrounded = true;

// 🎮 управление
const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;

    // Ctrl включает/выключает мышь
    if (e.key === "Control") {
        if (document.pointerLockElement) {
            document.exitPointerLock();
        } else {
            document.body.requestPointerLock();
        }
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});

// Клик также позволяет войти в режим игры
document.addEventListener("click", () => {
    if (!document.pointerLockElement) {
        document.body.requestPointerLock();
    }
});

// 🖱 мышь
let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", (e) => {
    if (!document.pointerLockElement) return;

    // Исправлено направление осей мыши
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(-1.5, Math.min(1.5, pitch));
});

// 🌳 дерево
function tree(x, z){
    const trunk = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 2, 0.5),
        new THREE.MeshLambertMaterial({ color: 0x8B4513 })
    );
    trunk.position.set(x, 1, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1),
        new THREE.MeshLambertMaterial({ color: 0x00ff00 })
    );
    leaves.position.set(x, 3, z);
    scene.add(leaves);
}

// 🌲 лес
for(let i = 0; i < 30; i++){
    tree(
        (Math.random() * 40) - 20,
        (Math.random() * 40) - 20
    );
}

// 🧠 движение
function update(){
    const speed = keys["shift"] ? 0.25 : 0.12;

    let dx = 0;
    let dz = 0;

    if(keys["w"]) dz -= 1;
    if(keys["s"]) dz += 1;
    if(keys["a"]) dx -= 1;
    if(keys["d"]) dx += 1;

    // Вычисление направления движения относительно взгляда
    if(dx !== 0 || dz !== 0){
        const len = Math.sqrt(dx * dx + dz * dz);
        dx /= len;
        dz /= len;

        const forwardX = Math.sin(yaw);
        const forwardZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = Math.sin(yaw);

        player.position.x += (forwardX * dz + rightX * dx) * speed;
        player.position.z += (forwardZ * dz + rightZ * dx) * speed;
    }

    // Логика прыжка
    if (keys[" "] && isGrounded) {
        velocityY = jumpForce;
        isGrounded = false;
    }

    if (!isGrounded) {
        velocityY -= gravity;
        player.position.y += velocityY;

        if (player.position.y <= playerHeight) {
            player.position.y = playerHeight;
            velocityY = 0;
            isGrounded = true;
        }
    }

    // Камера всегда следует за позицией игрока
    camera.position.copy(player.position);

    // Рассчитываем направление взгляда
    const lookDir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
    );

    camera.lookAt(player.position.clone().add(lookDir));
}

// 📏 изменение окна
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🔁 цикл
function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
